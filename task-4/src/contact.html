<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Ummadi Venkata Naga Shashank for web development inquiries and collaboration. Real-time validated contact form.">
  <meta name="author" content="Ummadi Venkata Naga Shashank">
  <title>Contact | Ummadi Venkata Naga Shashank</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Contact Me</h1>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Get in Touch</h2>

      <form id="contact-form" action="#" method="post" aria-label="Contact Form" novalidate>
        <div class="form-group">
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required aria-required="true" autocomplete="name">
          <span class="error-msg" id="fullname-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required aria-required="true" autocomplete="email">
          <span class="error-msg" id="email-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="subject">Subject:</label>
          <input type="text" id="subject" name="subject" required aria-required="true">
          <span class="error-msg" id="subject-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
          <span class="error-msg" id="message-error" role="alert"></span>
        </div>

        <div class="form-group">
          <button type="submit" aria-label="Send Message">Submit</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Ummadi Venkata Naga Shashank. All rights reserved.</p>
  </footer>

</body>
</html>
