<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Ummadi Venkata Naga Shashank for web development inquiries.">
  <title>Contact | Ummadi Venkata Naga Shashank</title>
</head>
<body>

  <a href="#main-content" style="position:absolute; left:-9999px;" onfocus="this.style.left='0';">Skip to main content</a>

  <header>
    <h1>Contact Me</h1>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Get in Touch</h2>

      <form action="#" method="post" aria-label="Contact Form">
        <div>
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required aria-required="true" autocomplete="name">
        </div>

        <div>
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required aria-required="true" autocomplete="email">
        </div>

        <div>
          <label for="subject">Subject:</label>
          <input type="text" id="subject" name="subject" required aria-required="true">
        </div>

        <div>
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
        </div>

        <div>
          <button type="submit" aria-label="Send Message">Submit</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Ummadi Venkata Naga Shashank. All rights reserved.</p>
  </footer>

</body>
</html>
